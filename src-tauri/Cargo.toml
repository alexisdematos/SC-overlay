[package]
name = "sc-overlay"
version = "0.1.0"
description = "All-in-one Star Citizen overlay"
edition = "2021"

[lib]
name = "sc_overlay_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
